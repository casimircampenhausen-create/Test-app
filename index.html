<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit-Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#f1f5f9; --muted:#94a3b8; --accent:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto;
         padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
                 calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  h1 { font-size:1.5rem; margin:8px 0 16px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid #334155; background:var(--card); color:var(--fg); font-size:16px; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#052e16; font-weight:600; font-size:16px; }
  button.ghost { background:transparent; color:var(--muted); padding:8px; }
  .habit { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .name { font-weight:600; }
  .streak { color:var(--muted); font-size:.85rem; }
  .days { display:flex; gap:6px; margin-top:10px; }
  .day { flex:1; text-align:center; font-size:.7rem; color:var(--muted); }
  .day button { display:block; width:100%; margin-top:4px; padding:10px 0; background:#334155; color:var(--fg); font-size:14px; }
  .day button.done { background:var(--accent); color:#052e16; }
  .day button.today { outline:2px solid var(--fg); outline-offset:1px; }
  .notice { background:#7c2d12; color:#ffedd5; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:.85rem; }
  .backup { display:flex; gap:8px; margin-top:24px; }
  .backup button { flex:1; background:#334155; color:var(--fg); }
  .empty { color:var(--muted); text-align:center; margin-top:32px; }
</style>
</head>
<body>
<main>
  <h1>Habit-Tracker</h1>
  <form id="form">
    <input id="name" type="text" placeholder="Neue Gewohnheit…" maxlength="60" autocomplete="off" required>
    <button type="submit">Hinzufügen</button>
  </form>
  <div id="notice" class="notice" hidden></div>
  <div id="list"></div>
  <div class="backup">
    <button id="export" type="button">Backup exportieren</button>
    <button id="import" type="button">Backup importieren</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</main>
<script>
const KEY = 'habits-v1';

// localStorage kann in iOS Private Mode / bei blockierten Daten werfen -> Speicher-Fallback im RAM.
const store = (() => {
  const mem = {};
  let persistent = true;
  try {
    const t = '__probe__';
    localStorage.setItem(t, '1'); localStorage.removeItem(t);
  } catch (e) { persistent = false; }
  return {
    persistent: () => persistent,
    get(k) {
      if (persistent) { try { return localStorage.getItem(k); } catch (e) { persistent = false; } }
      return k in mem ? mem[k] : null;
    },
    set(k, v) {
      mem[k] = v;
      if (persistent) { try { localStorage.setItem(k, v); return true; } catch (e) { persistent = false; } }
      return false;
    }
  };
})();

let habits = load();

function load() {
  try {
    const data = JSON.parse(store.get(KEY));
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}
function save() {
  store.set(KEY, JSON.stringify(habits));
  showNotice();
}
function showNotice() {
  const n = document.getElementById('notice');
  n.hidden = store.persistent();
  n.textContent = 'Speichern ist nicht möglich (Privater Modus oder Speicher blockiert). Daten gehen beim Schließen verloren – bitte regelmäßig ein Backup exportieren.';
}

// Backup als JSON
function validate(data) {
  if (!Array.isArray(data)) throw new Error('Ungültiges Format');
  return data.map(h => {
    if (!h || typeof h.name !== 'string' || !h.name.trim()) throw new Error('Ungültiger Eintrag');
    const days = {};
    Object.keys(h.days && typeof h.days === 'object' ? h.days : {}).forEach(k => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && h.days[k]) days[k] = true;
    });
    return { id: String(h.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), name: h.name.trim().slice(0, 60), days };
  });
}
async function exportBackup() {
  const json = JSON.stringify({ app: 'habit-tracker', version: 1, exported: new Date().toISOString(), habits }, null, 2);
  const file = new File([json], 'habit-backup-' + iso(new Date()) + '.json', { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      const list = validate(Array.isArray(parsed) ? parsed : parsed.habits);
      if (!confirm(list.length + ' Gewohnheit(en) importieren? Aktuelle Daten werden ersetzt.')) return;
      habits = list; save(); render();
    } catch (e) { alert('Import fehlgeschlagen: ' + e.message); }
  };
  r.onerror = () => alert('Datei konnte nicht gelesen werden.');
  r.readAsText(file);
}

function iso(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); out.push(d);
  }
  return out;
}
function streak(h) {
  let s = 0; const d = new Date();
  if (!h.days[iso(d)]) d.setDate(d.getDate() - 1);
  while (h.days[iso(d)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}

function render() {
  const list = document.getElementById('list');
  list.textContent = '';
  if (!habits.length) {
    const p = document.createElement('p');
    p.className = 'empty'; p.textContent = 'Noch keine Gewohnheiten. Lege oben die erste an.';
    list.appendChild(p); return;
  }
  const days = lastDays(7), today = iso(new Date());
  habits.forEach(h => {
    const card = document.createElement('div'); card.className = 'habit';
    const top = document.createElement('div'); top.className = 'top';
    const left = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = h.name;
    const st = document.createElement('div'); st.className = 'streak'; st.textContent = '🔥 ' + streak(h) + ' Tage in Folge';
    left.append(name, st);
    const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'Löschen';
    del.onclick = () => { if (confirm('„' + h.name + '“ löschen?')) { habits = habits.filter(x => x.id !== h.id); save(); render(); } };
    top.append(left, del);
    const row = document.createElement('div'); row.className = 'days';
    days.forEach(d => {
      const k = iso(d);
      const cell = document.createElement('div'); cell.className = 'day';
      cell.append(d.toLocaleDateString('de-DE', { weekday: 'short' }));
      const b = document.createElement('button');
      b.textContent = d.getDate();
      if (h.days[k]) b.classList.add('done');
      if (k === today) b.classList.add('today');
      b.onclick = () => { if (h.days[k]) delete h.days[k]; else h.days[k] = true; save(); render(); };
      cell.appendChild(b); row.appendChild(cell);
    });
    card.append(top, row); list.appendChild(card);
  });
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('name');
  const name = input.value.trim();
  if (!name) return;
  habits.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, days: {} });
  input.value = ''; save(); render();
});

document.getElementById('export').addEventListener('click', exportBackup);
document.getElementById('import').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) importBackup(f);
});

showNotice();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service Worker konnte nicht registriert werden – App läuft ohne Offline-Cache.', err);
    });
  });
}
</script>
</body>
</html>
